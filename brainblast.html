(The writer has only one sister.)`,opts:[`My sister, who lives in Aviemore, is a ski instructor.`,`My sister who lives in Aviemore, is a ski instructor.`,`My sister, who lives in Aviemore is a ski instructor.`,`My sister who lives in Aviemore is a ski instructor.`],a:`My sister, who lives in Aviemore, is a ski instructor.`,hint:`If the clause is extra information, fence it off at both ends — like brackets.`,ex:`With only one sister, the clause is extra information, so it needs a comma on each side.`},{id:`cl109`,topic:`clauses`,q:`Where should the comma go?

"Although Skye is busy in summer it is quiet in winter."`,opts:[`after "summer"`,`after "Although"`,`after "Skye"`,`after "quiet"`],a:`after "summer"`,hint:`A subordinate clause placed at the front is closed off before the main clause starts.`,ex:`The fronted clause "Although Skye is busy in summer" ends there, so the comma marks the join.`},{id:`cl110`,topic:`clauses`,q:`What type of sentence is this?

"The pipers marched along the high street in the pouring rain."`,opts:[`Simple`,`Compound`,`Complex`,`Compound-complex`],a:`Simple`,hint:`Length is not the test — count the verbs.`,ex:`It is long, but it has only one clause and one verb group, so it is a simple sentence.`},{id:`cl113`,topic:`clauses`,q:`Which part of this sentence is the embedded clause?

"Aisha read her book while she waited for the train."`,opts:[`While she waited for the train, Aisha read her book.`,`While she waited for the train Aisha read her book.`,`Aisha, while she waited for the train read her book.`,`Aisha read her book, while she waited for the train.`],a:`While she waited for the train, Aisha read her book.`,hint:`Fronting a subordinate clause changes the punctuation as well as the order.`,ex:`The subordinate clause comes first and a comma marks where the main clause begins.`},{id:`cl115`,topic:`clauses`,q:`Which sentence contains a subordinate clause?`,opts:[`Rory smiled when the sun finally appeared.`,`Rory smiled and waved at the crowd.`,`Rory smiled at the photographer.`,`Rory smiled for the camera and then waved.`],a:`Rory smiled when the sun finally appeared.`,hint:`Look for a word such as when, because, although or if.`,ex:`"When the sun finally appeared" cannot stand alone, so it is a subordinate clause.`},{id:`cl116`,topic:`clauses`,q:`What job does the relative clause do here?

"When the storm passed, Freya opened the window and the room filled with fresh air."`,opts:[`Three`,`Two`,`Four`,`One`],a:`Three`,hint:`Every clause has its own verb group — count them.`,ex:`The clauses are "When the storm passed", "Freya opened the window" and "the room filled with fresh air".`},{id:`cl122`,topic:`clauses`,q:`Choose the correct relative word:

"The village ___ we stayed is near Aviemore."`,opts:[`where`,`which`,`who`,`whose`],a:`where`,hint:`The clause tells you the place in which something happened.`,ex:`"Where" links a relative clause to a place: the village where we stayed.`},{id:`cl123`,topic:`clauses`,q:`Which sentence is complex?`,opts:[`Callum missed the bus because he overslept.`,`Callum missed the bus and walked to school.`,`Callum missed the bus this morning.`,`Callum missed the bus; he walked instead.`],a:`Callum missed the bus because he overslept.`,hint:`A complex sentence needs a main clause and a subordinate clause.`,ex:`"Because he overslept" is subordinate, so joining it to a main clause makes the sentence complex.`},{id:`cl124`,topic:`clauses`,q:`Which sentence begins with a subordinate clause?`,opts:[`Before the concert started, the hall was silent.`,`The hall was silent before the concert started.`,`In the hall, everyone was silent.`,`The silent hall waited for the concert.`],a:`Before the concert started, the hall was silent.`,hint:`A clause has its own verb; a phrase does not.`,ex:`"Before the concert started" has its own verb and cannot stand alone, so it is a fronted subordinate clause.`},{id:`cl125`,topic:`clauses`,q:`Choose the correct relative pronoun:

"My trainers which cost a fortune fell apart in a week."`,opts:[`After "trainers" and after "fortune"`,`After "trainers" only`,`After "fortune" only`,`After "apart" only`],a:`After "trainers" and after "fortune"`,hint:`A clause of extra information is fenced off at both ends.`,ex:`"Which cost a fortune" is extra information, so a comma is needed at each end of it.`},{id:`cl128`,topic:`clauses`,q:`Which part of this sentence is the main clause?

"Even though the glen was quiet, Aisha kept walking until darkness fell."`,opts:[`Aisha kept walking`,`Even though the glen was quiet`,`until darkness fell`,`the glen was quiet`],a:`Aisha kept walking`,hint:`Strip away every part that begins with a joining word and see what survives.`,ex:`With both subordinate clauses removed, "Aisha kept walking" still stands alone as a sentence.`},{id:`cl129`,topic:`clauses`,q:`What type of sentence is this?

"Because the tide was out, we crossed to the island and we picnicked on the sand."`,opts:[`Compound-complex`,`Complex`,`Compound`,`Simple`],a:`Compound-complex`,hint:`Check for BOTH two main clauses AND a subordinate clause.`,ex:`Two main clauses joined by "and" plus a subordinate clause beginning "Because" make it compound-complex.`},{id:`cl130`,topic:`clauses`,q:`Which sentence uses its relative pronouns correctly?`,opts:[`The pupils who visited the museum saw a skeleton which was 5,000 years old.`,`The pupils which visited the museum saw a skeleton who was 5,000 years old.`,`The pupils whose visited the museum saw a skeleton which was 5,000 years old.`,`The pupils who visited the museum saw a skeleton whom was 5,000 years old.`],a:`The pupils who visited the museum saw a skeleton which was 5,000 years old.`,hint:`"Who" belongs with people and "which" belongs with things.`,ex:`The pupils are people, so they take "who"; the skeleton is a thing, so it takes "which".`},{id:`pv101`,topic:`voice`,q:`Which sentence is in the PASSIVE voice?`,opts:[`The window was cracked by a stray ball.`,`A stray ball cracked the window.`,`The ball rolled down the hill.`,`Cracking windows is expensive.`],a:`The window was cracked by a stray ball.`,hint:`In the passive, the subject has the action done to it.`,ex:`The subject "the window" receives the action, and the doer follows "by".`},{id:`pv102`,topic:`voice`,q:`Which sentence is in the ACTIVE voice?`,opts:[`Freya painted the shed.`,`The shed was painted by Freya.`,`The shed had been painted.`,`The shed was being painted.`],a:`Freya painted the shed.`,hint:`In the active voice the subject does the action.`,ex:`Freya is the subject and she does the painting, so the sentence is active.`},{id:`pv103`,topic:`voice`,q:`Rewrite in the passive voice:

"Mistakes were made."`,opts:[`It avoids saying who made the mistakes`,`It makes clear exactly who is to blame`,`It shifts the sentence into the future`,`It turns the statement into a question`],a:`It avoids saying who made the mistakes`,hint:`Notice what is missing from the end of the sentence.`,ex:`With no "by ..." phrase, the passive reports the mistakes while keeping the doer hidden.`},{id:`pv116`,topic:`voice`,q:`Which sentence is in the ACTIVE voice?`,opts:[`Aisha has written a poem about the loch.`,`A poem about the loch has been written by Aisha.`,`The poem was read aloud.`,`The poem is being marked.`],a:`Aisha has written a poem about the loch.`,hint:`Find the sentence whose subject is doing the action.`,ex:`Aisha is the subject and she does the writing, so the sentence is active.`},{id:`pv117`,topic:`voice`,q:`Rewrite in the passive voice:

"We stayed indoors while the storm raged outside."`,opts:[`while the storm raged outside`,`We stayed indoors`,`the storm raged`,`stayed indoors`],a:`while the storm raged outside`,hint:`A subordinate clause starts with a joining word and cannot stand alone.`,ex:`"While the storm raged outside" begins with "while", so it depends on the main clause.`},{id:`cl132`,topic:`clauses`,q:`Identify the main clause:

"Although she was nervous, Aisha stepped onto the stage."`,opts:[`Aisha stepped onto the stage`,`Although she was nervous`,`she was nervous`,`onto the stage`],a:`Aisha stepped onto the stage`,hint:`The main clause still makes sense with everything else removed.`,ex:`"Aisha stepped onto the stage" stands alone as a complete sentence, so it is the main clause.`},{id:`cl133`,topic:`clauses`,q:`Identify the subordinating conjunction:

"Rory wore two jumpers because the bothy was freezing."`,opts:[`because`,`and`,`two`,`wore`],a:`because`,hint:`Look for the word that makes the second idea depend on the first.`,ex:`"Because" introduces the subordinate clause "because the bothy was freezing".`},{id:`cl134`,topic:`clauses`,q:`Choose the correct relative pronoun:

"The runner ___ trained hardest won the medal."`,opts:[`who`,`which`,`where`,`whose`],a:`who`,hint:`The clause is about a person doing the action.`,ex:`"Who" is the relative pronoun for a person acting as the subject.`},{id:`cl135`,topic:`clauses`,q:`Choose the correct relative pronoun:

"That is the café ___ we first met."`,opts:[`where`,`which`,`who`,`whom`],a:`where`,hint:`The clause tells you the place in which something happened.`,ex:`"Where" links a relative clause to a place: the café where we met.`},{id:`cl136`,topic:`clauses`,q:`Choose the correct relative pronoun:

"The kettle boiled and Freya made the tea."`,opts:[`Compound`,`Simple`,`Complex`,`Compound-complex`],a:`Compound`,hint:`Two main clauses joined by a coordinating conjunction.`,ex:`Two complete clauses joined by "and" make a compound sentence.`},{id:`cl138`,topic:`clauses`,q:`What type of sentence is this?

"We cancelled the walk because the path was flooded."`,opts:[`Complex`,`Simple`,`Compound`,`Compound-complex`],a:`Complex`,hint:`One clause here cannot stand on its own.`,ex:`A main clause plus a subordinate clause beginning "because" makes a complex sentence.`},{id:`cl139`,topic:`clauses`,q:`What type of sentence is this?

"The old lighthouse stood alone on the rocky headland."`,opts:[`Simple`,`Compound`,`Complex`,`Compound-complex`],a:`Simple`,hint:`Count the verbs, not the words.`,ex:`It is descriptive but has only one clause and one verb, so it is a simple sentence.`},{id:`cl140`,topic:`clauses`,q:`Which part of this sentence is the embedded clause?

"The bridge, which the flood had damaged, was closed."`,opts:[`which the flood had damaged`,`The bridge was closed`,`was closed`,`the flood`],a:`which the flood had damaged`,hint:`An embedded clause is dropped inside the main clause, often between commas.`,ex:`It sits inside "The bridge was closed" and is fenced off by a pair of commas.`},{id:`cl141`,topic:`clauses`,q:`Which sentence contains a subordinate clause?`,opts:[`Callum cheered when the whistle blew.`,`Callum cheered and clapped loudly.`,`Callum cheered at the final goal.`,`Callum cheered for his team and waved.`],a:`Callum cheered when the whistle blew.`,hint:`Look for a word such as when, because, although or if.`,ex:`"When the whistle blew" cannot stand alone, so it is a subordinate clause.`},{id:`cl142`,topic:`clauses`,q:`Is the relative clause defining or non-defining?

"The pupil who scored the goal was cheered."`,opts:[`Defining`,`Non-defining`,`Neither — it is a main clause`,`Neither — it is a phrase`],a:`Defining`,hint:`Does the clause tell you which pupil, or just add extra detail?`,ex:`It has no commas and pins down which pupil is meant, so it is a defining relative clause.`},{id:`cl143`,topic:`clauses`,q:`Where should the comma go?

"Because the tide was rising we hurried back."`,opts:[`after "rising"`,`after "Because"`,`after "tide"`,`after "back"`],a:`after "rising"`,hint:`A subordinate clause at the front is closed off before the main clause starts.`,ex:`The fronted clause "Because the tide was rising" ends there, so the comma marks the join.`},{id:`cl144`,topic:`clauses`,q:`Which word is NOT a subordinating conjunction?`,opts:[`so`,`because`,`although`,`while`],a:`so`,hint:`One of these links two clauses of equal weight.`,ex:`"So" is a coordinating conjunction, joining two main clauses rather than subordinating one.`},{id:`cl145`,topic:`clauses`,q:`How many clauses does this sentence contain?

"If the rain stops, we will walk to the falls and take some photographs."`,opts:[`Three`,`Two`,`Four`,`One`],a:`Three`,hint:`Every clause has its own verb group — count them.`,ex:`The clauses are "If the rain stops", "we will walk to the falls" and "(we will) take some photographs".`},{id:`cl146`,topic:`clauses`,q:`Choose the version with the subordinate clause moved to the front:

"When the ferry docked, the passengers, who were exhausted, cheered."`,opts:[`the passengers cheered`,`When the ferry docked`,`who were exhausted`,`the ferry docked`],a:`the passengers cheered`,hint:`Strip away every part that begins with a joining word and see what survives.`,ex:`With both subordinate parts removed, "the passengers cheered" stands alone as a sentence.`},{id:`cl151`,topic:`clauses`,q:`What type of sentence is this?

"When the lights dimmed, the audience fell silent and the play began."`,opts:[`Compound-complex`,`Complex`,`Compound`,`Simple`],a:`Compound-complex`,hint:`Check for BOTH two main clauses AND a subordinate clause.`,ex:`Two main clauses joined by "and" plus a subordinate clause beginning "When" make it compound-complex.`},{id:`cl152`,topic:`clauses`,q:`Identify the subordinating conjunction:

"Unless the fog lifts, the flight will be delayed."`,opts:[`Unless`,`will`,`the`,`lifts`],a:`Unless`,hint:`Which word makes the first half unable to stand alone?`,ex:`"Unless" introduces the subordinate clause "Unless the fog lifts".`},{id:`cl153`,topic:`clauses`,q:`Choose the correctly punctuated sentence.

(The writer has only one brother.)`,opts:[`My brother, who lives in Perth, plays the pipes.`,`My brother who lives in Perth, plays the pipes.`,`My brother, who lives in Perth plays the pipes.`,`My brother who lives in Perth plays the pipes.`],a:`My brother, who lives in Perth, plays the pipes.`,hint:`If the clause is extra information, fence it off at both ends.`,ex:`With only one brother, the clause is extra information, so it needs a comma on each side.`},{id:`cl154`,topic:`clauses`,q:`Which sentence is missing a pair of commas?`,opts:[`My uncle who is a chef cooked the whole meal.`,`The dog that chased the ball is ours.`,`The parcel that arrived today is heavy.`,`Anyone who is late will miss the bus.`],a:`My uncle who is a chef cooked the whole meal.`,hint:`Only extra information needs commas; information that identifies does not.`,ex:`"Who is a chef" is extra information about someone already identified, so it needs a comma at each end.`},{id:`cl155`,topic:`clauses`,q:`Choose the correct relative pronoun:

"The scientist ___ we interviewed studies whales."`,opts:[`whom`,`which`,`whose`,`what`],a:`whom`,hint:`The person is not doing the action — the person is being interviewed.`,ex:`"Whom" is used when the person is the object of the verb: we interviewed her.`},{id:`cl156`,topic:`clauses`,q:`How many clauses does this sentence contain?

"The gulls cried overhead."`,opts:[`One`,`Two`,`Three`,`Four`],a:`One`,hint:`Count the verb groups.`,ex:`There is a single verb group, "cried", so the sentence has just one clause.`},{id:`cl157`,topic:`clauses`,q:`Which sentence begins with a subordinate clause?`,opts:[`As soon as the bell rang, the pupils rushed out.`,`The pupils rushed out as soon as the bell rang.`,`At the sound of the bell, the pupils rushed out.`,`The pupils rushed out at the bell.`],a:`As soon as the bell rang, the pupils rushed out.`,hint:`A clause has its own verb; a phrase does not.`,ex:`"As soon as the bell rang" has its own verb and cannot stand alone, so it is a fronted subordinate clause.`},{id:`cl158`,topic:`clauses`,q:`What job does the relative clause do here?

"The trainers that I bought last week are already worn out."`,opts:[`It tells you which trainers are meant`,`It adds extra information you could remove`,`It joins two main clauses`,`It replaces the main verb`],a:`It tells you which trainers are meant`,hint:`Try deleting the clause and see whether you still know which trainers.`,ex:`It is a defining relative clause: it pins down which trainers, which is why it takes no commas.`},{id:`cl159`,topic:`clauses`,q:`Where should the commas go?

"The castle which dates from 1400 attracts many visitors."`,opts:[`After "castle" and after "1400"`,`After "castle" only`,`After "1400" only`,`After "visitors" only`],a:`After "castle" and after "1400"`,hint:`A clause of extra information is fenced off at both ends.`,ex:`"Which dates from 1400" is extra information, so a comma is needed at each end of it.`},{id:`cl160`,topic:`clauses`,q:`Which sentence uses its relative pronouns correctly?`,opts:[`The chef who cooked the meal used herbs that she had grown.`,`The chef which cooked the meal used herbs who she had grown.`,`The chef whose cooked the meal used herbs that she had grown.`,`The chef who cooked the meal used herbs whom she had grown.`],a:`The chef who cooked the meal used herbs that she had grown.`,hint:`"Who" belongs with people and "that" or "which" belongs with things.`,ex:`The chef is a person, so she takes "who"; the herbs are things, so they take "that".`},{id:`pv121`,topic:`voice`,q:`Which sentence is in the PASSIVE voice?`,opts:[`The letter was posted this morning.`,`The postman posted the letter.`,`The letter arrived late.`,`Posting letters is easy.`],a:`The letter was posted this morning.`,hint:`In the passive, the subject has the action done to it.`,ex:`The subject "the letter" receives the action of being posted, so the sentence is passive.`},{id:`pv122`,topic:`voice`,q:`Which sentence is in the ACTIVE voice?`,opts:[`Rory baked the bread.`,`The bread was baked by Rory.`,`The bread had been baked.`,`The bread was being baked.`],a:`Rory baked the bread.`,hint:`In the active voice the subject does the action.`,ex:`Rory is the subject and he does the baking, so the sentence is active.`},{id:`pv123`,topic:`voice`,q:`Rewrite in the passive voice:

"The volunteers planted the trees."`,opts:[`The trees were planted by the volunteers.`,`The trees was planted by the volunteers.`,`The volunteers were planted by the trees.`,`The trees have planted the volunteers.`],a:`The trees were planted by the volunteers.`,hint:`The object becomes the subject, and the verb takes a form of "to be".`,ex:`"The trees" becomes the plural subject, so the verb is "were planted", with the doer after "by".`},{id:`pv124`,topic:`voice`,q:`Rewrite in the active voice:

"The recycling ___ every Thursday."`,opts:[`is collected`,`was collected`,`collects`,`has collecting`],a:`is collected`,hint:`Match the tense to "every Thursday", then add the past participle.`,ex:`"Is collected" is the present simple passive: the recycling has the collecting done to it.`},{id:`pv128`,topic:`voice`,q:`Choose the correct future passive:

"The song was written by a local band."`,opts:[`written`,`was`,`song`,`band`],a:`written`,hint:`It is the part of the verb that could follow "have".`,ex:`"Written" is the past participle, and pairing it with "was" makes the verb passive.`},{id:`pv133`,topic:`voice`,q:`A report states: "The fire alarm was set off at noon."

"Someone has taken my umbrella."`,opts:[`My umbrella has been taken.`,`My umbrella was taking.`,`My umbrella has taken.`,`Someone has been taken my umbrella.`],a:`My umbrella has been taken.`,hint:`The present perfect passive uses "has been" before the past participle.`,ex:`"Has been taken" keeps the same tense and lets the vague agent "someone" drop away.`},{id:`pv137`,topic:`voice`,q:`When is the passive voice often the better choice?`,opts:[`When the doer is unknown or unimportant`,`When you want the writing to feel lively`,`When you want to name the doer first`,`When you are writing a personal diary`],a:`When the doer is unknown or unimportant`,hint:`Think about the sentences where no one is named after "by".`,ex:`The passive is useful when who did the action is unknown or does not matter.`},{id:`pv138`,topic:`voice`,q:`Rewrite in the passive voice:

"The gates are locked at dusk each day."`,opts:[`Present simple`,`Past simple`,`Future`,`Past perfect`],a:`Present simple`,hint:`"Each day" tells you this is a regular, present habit.`,ex:`"Are locked" is the present simple passive, describing something that happens every day.`}];ar.length;var or=[{id:`pu101`,topic:`punctuation`,q:`Where does the apostrophe go?

he size of that stag"! gasped Euan.`,`"Look at the size of that stag!", gasped Euan.`,`"Look at the size of that stag," gasped Euan!`],a:`"Look at the size of that stag!" gasped Euan.`,hint:`Who is doing the exclaiming — the speaker or the narrator?`,ex:`The exclamation is part of the speech, so it goes inside the inverted commas with no extra comma after them.`},{id:`pu125`,topic:`punctuation`,q:`Two characters are having a conversation. What should the writer do?`,opts:[`Start a new line each time the speaker changes.`,`Keep all the speech in one paragraph to save space.`,`Use a semicolon between the two speakers.`,`Put both speakers inside one set of inverted commas.`],a:`Start a new line each time the speaker changes.`,hint:`Think about how the reader keeps track of who is talking.`,ex:`A new line for each new speaker makes it clear to the reader when the speaker has changed.`},{id:`pu126`,topic:`punctuation`,q:`What is missing from this sentence?

"The path was steep and thick with mud. ___, everyone reached the summit."`,opts:[`Nevertheless`,`Consequently`,`Similarly`,`Meanwhile`],a:`Nevertheless`,hint:`Did the difficulty stop them, or not?`,ex:`"Nevertheless" shows that something happened in spite of the difficulty just described.`},{id:`co106`,topic:`cohesion`,q:`Choose the best connective:

"The ferry was cancelled. ___, we stayed another night on Skye."`,opts:[`Therefore`,`However`,`Meanwhile`,`Nevertheless`],a:`Therefore`,hint:`The second sentence is the result of the first.`,ex:`"Therefore" signals a consequence, and staying the night is the direct result of the cancellation.`},{id:`co107`,topic:`cohesion`,q:`Choose the best connective:

"Euan missed the bus ___ his alarm had not gone off."`,opts:[`because`,`although`,`whereas`,`despite`],a:`because`,hint:`The second part gives the reason for the first.`,ex:`"Because" introduces the cause, and the silent alarm is the reason he missed the bus.`},{id:`co108`,topic:`cohesion`,q:`Choose the best connective:

"Snow blocked the road overnight. ___, the school closed for the day."`,opts:[`As a result`,`In addition`,`On the other hand`,`By contrast`],a:`As a result`,hint:`Ask what caused what.`,ex:`"As a result" marks an effect, and the closure was caused by the blocked road.`},{id:`co109`,topic:`cohesion`,q:`Choose the best connective:

"___ the library was shut, we worked in the canteen instead."`,opts:[`Since`,`Despite`,`However`,`Whereas`],a:`Since`,hint:`The opening clause explains why they moved.`,ex:`"Since" can mean "because", giving the reason for working in the canteen.`},{id:`co110`,topic:`cohesion`,q:`Which connective signals a RESULT?`,opts:[`Consequently`,`Furthermore`,`Meanwhile`,`Similarly`],a:`Consequently`,hint:`Three of these add, compare or mark time instead.`,ex:`"Consequently" tells the reader that what follows was caused by what came before.`},{id:`co111`,topic:`cohesion`,q:`Choose the best connective:

"The new bikes are cheaper than the old ones. ___, they are lighter to carry."`,opts:[`Furthermore`,`However`,`Therefore`,`Meanwhile`],a:`Furthermore`,hint:`Is the writer adding another point, or turning against the first one?`,ex:`"Furthermore" adds a second point that supports the same argument.`},{id:`co112`,topic:`cohesion`,q:`Choose the best connective:

"The club badly needs new nets. ___, the changing rooms need repainting."`,opts:[`Moreover`,`Instead`,`Nevertheless`,`Consequently`],a:`Moreover`,hint:`The second problem is stacked on top of the first.`,ex:`"Moreover" adds a further point of the same kind, building up the case being made.`},{id:`co113`,topic:`cohesion`,q:`Which phrase tells the reader that the writer is ADDING another point?`,opts:[`In addition`,`On the other hand`,`As a result`,`Even so`],a:`In addition`,hint:`Two of the others signal contrast and one signals a consequence.`,ex:`"In addition" introduces extra supporting information rather than a contrast or a result.`},{id:`co114`,topic:`cohesion`,q:`Choose the best connective:

ntence should carry the line of argument.`,ex:`It states the paragraph's position and prepares the reader for the drawbacks that follow.`},{id:`co121`,topic:`cohesion`,q:`A paragraph has explained the benefits of school trips. Which opening best links the NEXT paragraph, which is about their cost?`,opts:[`These benefits, however, come at a price.`,`School trips are usually good fun.`,`In conclusion, school trips are worthwhile.`,`Firstly, school trips are educational.`],a:`These benefits, however, come at a price.`,hint:`A good link looks back at the last paragraph and forward to the new one.`,ex:`"These benefits" refers back to the previous paragraph while "however" introduces the new, contrasting idea.`},{id:`co122`,topic:`cohesion`,q:`Why do writers use linking phrases at the start of paragraphs?`,opts:[`To show how the new paragraph relates to the one before.`,`To make each paragraph longer.`,`To signal that someone is about to speak.`,`To remove the need for punctuation.`],a:`To show how the new paragraph relates to the one before.`,hint:`Think about what the reader needs in order to follow the argument.`,ex:`Linking phrases hold a text together by showing the relationship between one paragraph and the next.`},{id:`co123`,topic:`cohesion`,q:`What is the problem with this sentence?
